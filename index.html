<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minescout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>MINESCOUT</h1>
    <canvas id="gameCanvas"></canvas>
    <div id="difficulty">
      <label for="mineCount">Mines</label>
      <input type="number" id="mineCount" min="0" max="250" step="5" value="55" inputmode="numeric" pattern="[0-9]*">
      <div id="tank-toggle-wrap">
        <label for="tankToggle">Tank</label>
        <button id="tankToggle" class="toggle" aria-pressed="true">ON</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
